name: build

on:
  push:
    branches:
      - main
      - feature/v2.1-discovery-evidence
      - dev/preview13-merged-evidence
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - feature/v2.1-discovery-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: cmd
        run: dotnet restore GPOSettingsExplorer.sln

      - name: UI style lint
        shell: cmd
        run: dotnet run --project tools\UiStyleLint\UiStyleLint.csproj -- src\GPOSettingsExplorer

      - name: Build
        shell: cmd
        run: dotnet build GPOSettingsExplorer.sln -c Release --no-restore

      - name: Core regression tests
        shell: cmd
        run: dotnet run --project tools\CoreTests\CoreTests.csproj -c Release --no-build

      - name: Publish win-x64
        shell: cmd
        run: dotnet publish src\GPOSettingsExplorer\GPOSettingsExplorer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts\win-x64

      - name: Publish win-arm64
        shell: cmd
        run: dotnet publish src\GPOSettingsExplorer\GPOSettingsExplorer.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -o artifacts\win-arm64

      - name: Optional Authenticode code signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Host 'No signing certificate configured. Files remain unsigned.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'AUTHENTICODE_PFX_PASSWORD is missing.'
          }
          $sdk = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)) 'Windows Kits\10\bin'
          $tool = Get-ChildItem $sdk -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -like '*\x64\signtool.exe' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $tool) { throw 'Windows SDK signing tool not found.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'gposes-signing.pfx'
          try {
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            foreach ($runtime in @('win-x64', 'win-arm64')) {
              $exe = Join-Path (Join-Path $env:GITHUB_WORKSPACE "artifacts\$runtime") 'GPOSettingsExplorer.exe'
              & $tool sign /f $pfx /p $env:SIGNING_PFX_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $exe
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $runtime." }
              & $tool verify /pa $exe
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $runtime." }
            }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Create portable archives
        shell: cmd
        run: |
          7z a -tzip artifacts\GPOSettingsExplorer-win-x64-portable.zip .\artifacts\win-x64\*
          7z a -tzip artifacts\GPOSettingsExplorer-win-arm64-portable.zip .\artifacts\win-arm64\*

      - name: Upload portable builds
        uses: actions/upload-artifact@v4
        with:
          name: GPOSettingsExplorer-portable
          path: |
            artifacts/GPOSettingsExplorer-win-x64-portable.zip
            artifacts/GPOSettingsExplorer-win-arm64-portable.zip

      - name: Verify 2.1 preview EXE versions
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/v2.1-discovery-evidence' || github.ref == 'refs/heads/dev/preview13-merged-evidence')
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'src/GPOSettingsExplorer/GPOSettingsExplorer.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -notmatch '^2\.1\.0-preview\.\d+$') {
            throw "Unexpected preview version: $projectVersion"
          }
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            $exe = Join-Path (Join-Path $env:GITHUB_WORKSPACE "artifacts/$runtime") 'GPOSettingsExplorer.exe'
            $info = (Get-Item -LiteralPath $exe).VersionInfo
            if ($info.FileVersion -ne '2.1.0.0') {
              throw "Wrong $runtime FileVersion: $($info.FileVersion)"
            }
            if (!$info.ProductVersion.StartsWith($projectVersion, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Wrong $runtime ProductVersion: $($info.ProductVersion)"
            }
            Write-Host "$runtime : FileVersion=$($info.FileVersion); ProductVersion=$($info.ProductVersion)"
          }

      - name: Create GitHub 2.1 Preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v2.1-discovery-evidence'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content -LiteralPath 'src/GPOSettingsExplorer/GPOSettingsExplorer.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -notmatch '^2\.1\.0-preview\.\d+$') {
            throw "Unexpected preview version: $projectVersion"
          }
          $tag = "v$projectVersion"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $existingTarget = gh release view $tag --json targetCommitish --jq '.targetCommitish'
            if ($LASTEXITCODE -ne 0 -or $existingTarget.Trim() -ne $env:GITHUB_SHA) {
              throw "Preview tag $tag already points to another build; never silently replace an existing EXE."
            }
            Write-Host "Matching preview release already exists: $tag"
            exit 0
          }
          $notes = @'
          GPO Settings Explorer $projectVersion - TEST PREVIEW

          Preview 17 extends the reusable ADMX policy map to EVERY individual
          input field (text, numeric, list, enum and boolean), including fields
          in policies that have already been configured elsewhere. The schema
          is shared across GPOs and does not claim that a field is configured.
          Search by ADMX policy ID, field ID, label, full registry key or value
          name, then double-click to open and focus that exact field.
          The selected GPO's current values are read only when the editor opens.

          Configured GPMC rows are mapped by Computer/User scope and exact
          registry key/value identity, never merely by a display label. A
          duplicated ADMX field ID or registry target disables the generic
          writer; stale policy maps must be refreshed before changes.
          Duplicate legacy ADMX name matching has been removed.

          All Settings now favors direct schema-backed editing for the selected
          GPO, without repeatedly asking for the target GPO. Security Settings
          and Group Policy Preferences never inherit an ADMX editor solely
          from an identically named registry value or policy label.

          The primary All Settings toolbar is more compact; optional diagnostic
          and evidence tools are preserved under Advanced tools. Portable
          update checks use the preview release channel and SHA-256 downloads.
          Updates create rollback files and require a rendered WPF window to
          acknowledge startup, otherwise the updater attempts restoration.

          Existing manual, single-GPO MMC discovery and evidence checks remain
          available but are NOT a verified universal automation interface for
          every Windows or vendor snap-in. Unsupported extension fields are
          guarded/read-only; missing GPMC index entries do not prove Not Configured.

          This prerelease is for nonproduction verification; test native Windows
          GPO editing, high-DPI layouts, updater installation and rollback on
          your environment before deploying. Artifacts may be unsigned.

          Download win-x64 for Intel/AMD Windows or win-arm64 for ARM64 Windows.
          Extract the ZIP and run GPOSettingsExplorer.exe.
          '@
          $notes = $notes.Replace('$projectVersion', $projectVersion)
          gh release create $tag 'artifacts/GPOSettingsExplorer-win-x64-portable.zip' 'artifacts/GPOSettingsExplorer-win-arm64-portable.zip' --target $env:GITHUB_SHA --title "GPO Settings Explorer $tag" --prerelease --notes $notes
          if ($LASTEXITCODE -ne 0) {
            throw "Creating or uploading GitHub 2.1 preview release failed."
          }

      - name: Resolve release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          for /f "tokens=*" %%L in ('findstr /C:"<Version>" src\GPOSettingsExplorer\GPOSettingsExplorer.csproj') do set "VERSION_LINE=%%L"
          set "VERSION_LINE=!VERSION_LINE:<Version>=!"
          set "VERSION_LINE=!VERSION_LINE:</Version>=!"
          set "VERSION_LINE=!VERSION_LINE: =!"
          echo RELEASE_TAG=v!VERSION_LINE!>>"%GITHUB_ENV%"

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if not "%RELEASE_TAG:-=%"=="%RELEASE_TAG%" (
            echo Development version detected. Stable release on main is intentionally skipped.
            exit /b 0
          )
          gh release view "%RELEASE_TAG%" >nul 2>nul
          if errorlevel 1 (
            gh release create "%RELEASE_TAG%" artifacts\GPOSettingsExplorer-win-x64-portable.zip artifacts\GPOSettingsExplorer-win-arm64-portable.zip --target "%GITHUB_SHA%" --generate-notes --title "%RELEASE_TAG%"
          ) else (
            echo Release %RELEASE_TAG% already exists. Skipping release creation.
          )

  provenance:
    name: release-provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: GPOSettingsExplorer-portable
          path: artifacts

      - name: Attest both portable ZIPs
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*.zip
