name: build

on:
  push:
    branches:
      - main
      - feature/v2.1-discovery-evidence
      - dev/preview13-merged-evidence
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - feature/v2.1-discovery-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: cmd
        run: dotnet restore GPOSettingsExplorer.sln

      - name: UI style lint
        shell: cmd
        run: dotnet run --project tools\UiStyleLint\UiStyleLint.csproj -- src\GPOSettingsExplorer

      - name: Build
        shell: cmd
        run: dotnet build GPOSettingsExplorer.sln -c Release --no-restore

      - name: Core regression tests
        shell: cmd
        run: dotnet run --project tools\CoreTests\CoreTests.csproj -c Release --no-build

      - name: Publish win-x64
        shell: cmd
        run: dotnet publish src\GPOSettingsExplorer\GPOSettingsExplorer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts\win-x64

      - name: Publish win-arm64
        shell: cmd
        run: dotnet publish src\GPOSettingsExplorer\GPOSettingsExplorer.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -o artifacts\win-arm64

      - name: Optional Authenticode code signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Host 'No signing certificate configured. Files remain unsigned.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'AUTHENTICODE_PFX_PASSWORD is missing.'
          }
          $sdk = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)) 'Windows Kits\10\bin'
          $tool = Get-ChildItem $sdk -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -like '*\x64\signtool.exe' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $tool) { throw 'Windows SDK signing tool not found.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'gposes-signing.pfx'
          try {
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            foreach ($runtime in @('win-x64', 'win-arm64')) {
              $exe = Join-Path (Join-Path $env:GITHUB_WORKSPACE "artifacts\$runtime") 'GPOSettingsExplorer.exe'
              & $tool sign /f $pfx /p $env:SIGNING_PFX_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $exe
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $runtime." }
              & $tool verify /pa $exe
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $runtime." }
            }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Create portable archives
        shell: cmd
        run: |
          7z a -tzip artifacts\GPOSettingsExplorer-win-x64-portable.zip .\artifacts\win-x64\*
          7z a -tzip artifacts\GPOSettingsExplorer-win-arm64-portable.zip .\artifacts\win-arm64\*

      - name: Upload portable builds
        uses: actions/upload-artifact@v4
        with:
          name: GPOSettingsExplorer-portable
          path: |
            artifacts/GPOSettingsExplorer-win-x64-portable.zip
            artifacts/GPOSettingsExplorer-win-arm64-portable.zip

      - name: Verify 2.1 preview EXE versions
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/v2.1-discovery-evidence' || github.ref == 'refs/heads/dev/preview13-merged-evidence')
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'src/GPOSettingsExplorer/GPOSettingsExplorer.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -notmatch '^2\.1\.0-preview\.\d+$') {
            throw "Unexpected preview version: $projectVersion"
          }
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            $exe = Join-Path (Join-Path $env:GITHUB_WORKSPACE "artifacts/$runtime") 'GPOSettingsExplorer.exe'
            $info = (Get-Item -LiteralPath $exe).VersionInfo
            if ($info.FileVersion -ne '2.1.0.0') {
              throw "Wrong $runtime FileVersion: $($info.FileVersion)"
            }
            if (!$info.ProductVersion.StartsWith($projectVersion, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Wrong $runtime ProductVersion: $($info.ProductVersion)"
            }
            Write-Host "$runtime : FileVersion=$($info.FileVersion); ProductVersion=$($info.ProductVersion)"
          }

      - name: Create GitHub 2.1 Preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v2.1-discovery-evidence'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content -LiteralPath 'src/GPOSettingsExplorer/GPOSettingsExplorer.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -notmatch '^2\.1\.0-preview\.\d+$') {
            throw "Unexpected preview version: $projectVersion"
          }
          $tag = "v$projectVersion"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $existingTarget = gh release view $tag --json targetCommitish --jq '.targetCommitish'
            if ($LASTEXITCODE -ne 0 -or $existingTarget.Trim() -ne $env:GITHUB_SHA) {
              throw "Preview tag $tag already points to another build; never silently replace an existing EXE."
            }
            Write-Host "Matching preview release already exists: $tag"
            exit 0
          }
          $notes = @'
          TEST PREVIEW - GPO Settings Explorer $projectVersion.

          Includes the Discovery & Verification interface, explicit unit reviews, and prior Preview 6 MMC crash safeguards. Preview 7 adds an explicit per-GPO, read-only Kerberos GptTmpl.inf security source check in Exact MMC Paths. It compares one typed GPMC Account value with one complete, SHA-256-bound SecEdit [Kerberos Policy] record on the pinned DC. Preview 8 adds an explicit, cancellable Verify stored Kerberos source action in individual GPMC setting value windows. It only reads the selected pinned-DC GptTmpl.inf and shares its snapshot with Exact MMC Paths. Stored agreement is not native MMC or client RSoP. Preview 10 adds a typed, scope-specific, on-demand SRP Registry.pol ItemData path and Safer security level comparison in Exact MMC Paths. It requires one GPO, same pinned DC, full source SHA-256 and unique GPMC/SRP GUID path identity. Only saved path and level are compared; enforcement, other flags and effective RSoP remain unverified. No all-GPO MMC scan or policy write is initiated. Other SRP rule families remain unsupported.

          Preview 10 adds typed GPMC Group Policy Preferences Registry item indexing and searchable source report details (Action/Hive/Key path/Value name). It separates GPP from Registry.pol, does not index raw value data, and classifies Software Installation Applicability as source metadata rather than a standalone setting. No GPO changes, local Regedit, bulk MMC scans, or effective client RSoP claims.

          Preview 11 adds typed, pinned-DC GptTmpl.inf [System Access] stored-source number/boolean comparisons for known Password Policy and Account Lockout records. It also adds a redacted, bounded, one-GPO/scope GPP Registry.xml source metadata check: UID, order, action, hive, registry key, value name, type and targeting-filter presence, with file SHA-256. GPP VALUE DATA and item-level targeting decisions are deliberately not compared, captured into indexed text or presented as verified. Unknown/duplicate UID, unsupported layouts, changed files, wrong DC, missing/partial sources and malformed XML are blocked. Never claim MMC, client RSoP, effective account precedence or native policy writes.

          Preview 12 adds exact GPMC Registry source report navigation. A selected GPP Registry item opens the same GPO report and selects an item only when Computer/User scope, UID, original order, action and full hive/key/value target match; duplicated or stale identities fail closed. The legacy Configured GPMC list shows source registry paths/value names, with package Applicability and other XML metadata hidden by default. This is stored GPMC source, not Registry.pol or effective client RSoP.

          Preview 13 adds exact ADMX declaration/source file path hints in Exact MMC Paths with a metadata-only Copy source action, and an independent Open GPO editor (manual) button that never performs an automatic full native MMC inventory. Previously observed exact MMC row selection remains optional and separate. On request, a single selected Computer GPO's pinned Audit/audit.csv can be compared by exact System subcategory GUID and canonical numeric code to SHA-256-bound GPMC reports. Partial, ambiguous or other-DC values are not verified. Auditpol on clients, MMC values and effective client RSoP remain unknown.

          Preview 14 adds bounded-width, ellipsis-trimmed Exact MMC Paths grid cells with full-text tooltips for HiDPI layouts. Preview 15 adds a 250ms debounced text filter and explicit All scopes / Computer / User filtering. These controls are read-only and do not change GPOs. Manual testing at 200% scaling is still required.

          Full MMC inventory must be started manually for one selected GPO and may still encounter vendor or OS snap-in defects. Review skipped/partial coverage and test on a nonproduction DC first.

          NOT a production-validated 2.1.0 stable release. Verify in a nonproduction AD/DC environment first. Builds may be unsigned.

          Download the win-x64 ZIP for Intel/AMD Windows or win-arm64 for Windows ARM64, unzip it, and run GPOSettingsExplorer.exe.
          '@
          $notes = $notes.Replace('$projectVersion', $projectVersion)
          gh release create $tag 'artifacts/GPOSettingsExplorer-win-x64-portable.zip' 'artifacts/GPOSettingsExplorer-win-arm64-portable.zip' --target $env:GITHUB_SHA --title "GPO Settings Explorer $tag" --prerelease --notes $notes
          if ($LASTEXITCODE -ne 0) {
            throw "Creating or uploading GitHub 2.1 preview release failed."
          }

      - name: Resolve release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          for /f "tokens=*" %%L in ('findstr /C:"<Version>" src\GPOSettingsExplorer\GPOSettingsExplorer.csproj') do set "VERSION_LINE=%%L"
          set "VERSION_LINE=!VERSION_LINE:<Version>=!"
          set "VERSION_LINE=!VERSION_LINE:</Version>=!"
          set "VERSION_LINE=!VERSION_LINE: =!"
          echo RELEASE_TAG=v!VERSION_LINE!>>"%GITHUB_ENV%"

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if not "%RELEASE_TAG:-=%"=="%RELEASE_TAG%" (
            echo Development version detected. Stable release on main is intentionally skipped.
            exit /b 0
          )
          gh release view "%RELEASE_TAG%" >nul 2>nul
          if errorlevel 1 (
            gh release create "%RELEASE_TAG%" artifacts\GPOSettingsExplorer-win-x64-portable.zip artifacts\GPOSettingsExplorer-win-arm64-portable.zip --target "%GITHUB_SHA%" --generate-notes --title "%RELEASE_TAG%"
          ) else (
            echo Release %RELEASE_TAG% already exists. Skipping release creation.
          )

  provenance:
    name: release-provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: GPOSettingsExplorer-portable
          path: artifacts

      - name: Attest both portable ZIPs
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*.zip
