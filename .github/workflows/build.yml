name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: cmd
        run: dotnet restore GPOSettingsExplorer.sln

      - name: UI style lint
        shell: cmd
        run: dotnet run --project tools\UiStyleLint\UiStyleLint.csproj -- src\GPOSettingsExplorer

      - name: Build
        shell: cmd
        run: dotnet build GPOSettingsExplorer.sln -c Release --no-restore

      - name: Core regression tests
        shell: cmd
        run: dotnet run --project tools\CoreTests\CoreTests.csproj -c Release --no-build

      - name: Publish win-x64
        shell: cmd
        run: dotnet publish src\GPOSettingsExplorer\GPOSettingsExplorer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts\win-x64

      - name: Publish win-arm64
        shell: cmd
        run: dotnet publish src\GPOSettingsExplorer\GPOSettingsExplorer.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -o artifacts\win-arm64

      - name: Optional Authenticode code signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Host 'No signing certificate configured. Files remain unsigned.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'AUTHENTICODE_PFX_PASSWORD is missing.'
          }
          $sdk = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)) 'Windows Kits\10\bin'
          $tool = Get-ChildItem $sdk -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -like '*\x64\signtool.exe' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $tool) { throw 'Windows SDK signing tool not found.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'gposes-signing.pfx'
          try {
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            foreach ($runtime in @('win-x64', 'win-arm64')) {
              $exe = Join-Path (Join-Path $env:GITHUB_WORKSPACE "artifacts\$runtime") 'GPOSettingsExplorer.exe'
              & $tool sign /f $pfx /p $env:SIGNING_PFX_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $exe
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $runtime." }
              & $tool verify /pa $exe
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $runtime." }
            }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Create portable archives
        shell: cmd
        run: |
          7z a -tzip artifacts\GPOSettingsExplorer-win-x64-portable.zip .\artifacts\win-x64\*
          7z a -tzip artifacts\GPOSettingsExplorer-win-arm64-portable.zip .\artifacts\win-arm64\*

      - name: Upload portable builds
        uses: actions/upload-artifact@v4
        with:
          name: GPOSettingsExplorer-portable
          path: |
            artifacts/GPOSettingsExplorer-win-x64-portable.zip
            artifacts/GPOSettingsExplorer-win-arm64-portable.zip

      - name: Resolve release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          for /f "tokens=*" %%L in ('findstr /C:"<Version>" src\GPOSettingsExplorer\GPOSettingsExplorer.csproj') do set "VERSION_LINE=%%L"
          set "VERSION_LINE=!VERSION_LINE:<Version>=!"
          set "VERSION_LINE=!VERSION_LINE:</Version>=!"
          set "VERSION_LINE=!VERSION_LINE: =!"
          echo RELEASE_TAG=v!VERSION_LINE!>>"%GITHUB_ENV%"

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "%RELEASE_TAG%" >nul 2>nul
          if errorlevel 1 (
            gh release create "%RELEASE_TAG%" artifacts\GPOSettingsExplorer-win-x64-portable.zip artifacts\GPOSettingsExplorer-win-arm64-portable.zip --target "%GITHUB_SHA%" --generate-notes --title "%RELEASE_TAG%"
          ) else (
            echo Release %RELEASE_TAG% already exists. Skipping release creation.
          )

  provenance:
    name: release-provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: GPOSettingsExplorer-portable
          path: artifacts

      - name: Attest both portable ZIPs
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*.zip
